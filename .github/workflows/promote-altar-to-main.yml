name: Promote solved Altar r21 to main

on:
  push:
    branches:
      - altar-solved-v143b-r16
    paths:
      - ".github/workflows/promote-altar-to-main.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out promotion branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "Kaori"
          git config user.email "42208098+armangido@users.noreply.github.com"

      - name: Rebuild and run promotion helper
        run: |
          cat .altar_r21/promote_*.b64 | base64 -d > /tmp/promote.py
          python -m py_compile /tmp/promote.py
          python /tmp/promote.py
