name: Inspect staged Altar payload

on:
  push:
    branches:
      - altar-solved-v143b-r16
    paths:
      - ".github/workflows/inspect-altar-payload.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and inspect payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json, tarfile, zipfile
          parts=[]
          for p in sorted(Path(".altar_payload").glob("chunk_*.b64")):
              s="".join(p.read_text(encoding="utf-8").split())
              print(p.name, "chars=", len(s), "tail=", repr(s[-8:]))
              parts.append(s)
          joined="".join(parts)
          print("joined_chars=", len(joined), "mod4=", len(joined)%4)
          raw=base64.b64decode(joined + ("="*((-len(joined))%4)), validate=False)
          print("raw_bytes=", len(raw), "magic=", raw[:8])
          b=gzip.decompress(raw)
          out=Path("/tmp/altar_payload")
          out.write_bytes(b)
          print("payload_bytes=", len(b))
          print("head_repr=", repr(b[:500]))
          print("is_zip=", zipfile.is_zipfile(out))
          print("is_tar=", tarfile.is_tarfile(out))
          if zipfile.is_zipfile(out):
              with zipfile.ZipFile(out) as z:
                  print("zip_names=", z.namelist()[:100])
          elif tarfile.is_tarfile(out):
              with tarfile.open(out) as t:
                  print("tar_names=", t.getnames()[:100])
          else:
              try:
                  obj=json.loads(b.decode("utf-8"))
                  print("json_type=", type(obj).__name__)
                  if isinstance(obj, dict):
                      print("json_keys=", list(obj)[:100])
                      for k,v in list(obj.items())[:5]:
                          print("sample_key=", k, "value_type=", type(v).__name__)
                  elif isinstance(obj, list):
                      print("json_len=", len(obj))
                      print("json_sample=", repr(obj[:2])[:1000])
              except Exception as e:
                  print("json_error=", repr(e))
          PY
